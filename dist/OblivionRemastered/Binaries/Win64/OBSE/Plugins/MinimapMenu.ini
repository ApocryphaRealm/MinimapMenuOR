; Minimap Menu (Oblivion Remastered). Every setting is also on the Minimap Menu page of the
; Apocrypha Menu Framework, which rewrites this file; edits made while the game is closed are read at start.

[General]
; 1 = the minimap runs. 0 removes it and puts the game's location banner back where the game puts it.
bEnabled=1
; 1 = the minimap is shown when a game loads. The hide key only hides it until the next load; this setting is changed on the page.
bShowOnGameStart=1

[Display]
; Which screen corner the minimap is pinned to: 0 = top left, 1 = top right, 2 = bottom left, 3 = bottom right.
uAnchor=1
; A nudge per corner, in screen pixels, so each corner keeps its own adjustment. +x is always rightwards and +y always downwards, whichever corner is used; (0, 0) sits flush with the screen edges.
fOffsetXTopLeft=0.00
fOffsetYTopLeft=0.00
fOffsetXTopRight=0.00
fOffsetYTopRight=0.00
fOffsetXBottomLeft=0.00
fOffsetYBottomLeft=0.00
fOffsetXBottomRight=0.00
fOffsetYBottomRight=0.00
; The minimap's size. Capped at whatever keeps it within a quarter of the screen.
fScale=0.50
; 0 = square, 1 = circle.
uShape=0
; How opaque the minimap is.
fOpacity=1.00
; 1 = the minimap places the game's location banner (the area name that appears when you enter a place): below it at a top corner, above it at a bottom corner. 0 = HUD Position Manager (or the game) places it.
bLinkLocationPopup=1
; 1 = the location banner's text is scaled down to fit the minimap's width.
bFitPopupToMinimap=1
; The location banner's size, on top of the fit: with the fit on, 1.00 is the minimap's width.
fPopupScale=1.00
; 1 = the compass moves under the minimap (above it at a bottom corner), where the location banner was; the banner goes after the compass.
bPairCompass=0
; 1 = the paired compass is scaled down to the minimap's width.
bFitCompassToMinimap=1
; The paired compass's size, on top of the fit: with the fit on, 1.00 is the minimap's width.
fCompassScale=1.00
; The gap between the minimap and the location banner, in screen pixels.
fPopupGap=8.00

[Map]
; 0 = parchment only, 1 = the game's own local map (its wall and path lines) wherever you have opened the Map screen's local map, parchment elsewhere.
iMapImage=1
; How far from you the edge of the minimap reaches at the normal zoom, in metres.
fRadiusMetres=60.00
; The same reach indoors, in metres - interiors are smaller.
fRadiusInteriorMetres=25.00
; 1 = the map turns with the camera (up is where you look); 0 = north is always up.
bFollowCameraRotation=1
; 1 = the minimap draws the local map around you at all times, with the game's own capture and wall-line material; 0 = only where you opened the Map screen's local map.
bAlwaysDrawLocalMap=1

[Rendering]
; How much of the area around you is drawn, in metres across.
fCaptureWidthMetres=180.00
; Indoors, how far above your feet the map is cut: ceilings and floors above stay out of it.
fInteriorCutMetres=2.50
; The map is drawn again after you move this share of its width (or change cell).
fRecaptureMoveFraction=0.25
; A correction, if the drawn map comes out turned: quarter turns clockwise.
iMapQuarterTurns=0
; A correction, if the drawn map comes out mirrored.
bMapMirror=0
; 1 = the map is not drawn again while the world is loading or for iSettleMs after (a load, going in or out of doors, a teleport) - the last picture stays. Ordinary travel never waits.
bSkipWhileWorldSettles=1
; How long a load counts as still settling, in milliseconds.
iSettleMs=1500
; The least time between two drawings of the map, in milliseconds. The frame, markers and arrow keep updating either way.
iRedrawIntervalMs=1000

[Controls]
; Keyboard keys are DirectInput scan codes, 0 = none. 37 = K: tap to hide or show the minimap; hold to pan it (below).
iHideKey=37
; 38 = L: tap to switch between the two zoom levels.
iZoomToggleKey=38
; 1 = holding the hide key pans the map with the mouse (or the right stick); 0 = the hide key only hides and shows, the moment it is pressed.
bHoldHideToPan=1
; How long the hide key must be held before it pans instead of hiding, in seconds.
fHoldToPanSecs=0.25
; The magnification at the normal zoom level.
fZoomDefault=1.00
; The magnification at the other zoom level.
fZoomZoomedIn=2.00
; 1 = the controller button below also hides (tap) and pans (hold). Gameplay only, never in menus.
bGamepadHideButton=1
; Controller buttons are XInput masks: 128 (0x0080) = right stick click, 64 (0x0040) = left stick click.
iPanHoldGamepadButton=128
; How fast the map pans.
fPanSpeed=1.00

[Markers]
; 1 = doors on the minimap.
bDoors=1
; 1 = locations (cities, caves, forts, shrines...).
bLocations=1
; 1 = quest targets; one beyond the edge stays on the rim, pointing the way.
bQuestTargets=1
; 1 = a location beyond the edge stays on the rim, dimmed, pointing the way (as the compass shows it).
bFarLocationsOnRim=1
; 1 = enemies the compass shows, as red dots.
bHostiles=0
; The size of the icons.
fIconScale=1.00

[Log]
; 0 trace, 1 debug, 2 info, 3 warnings, 4 errors, 5 critical, 6 off. Use 1 when reporting a problem.
uLogLevel=2
